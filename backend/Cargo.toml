[package]
name = "local-blog-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local-first blog API reference implementation"

[dependencies]
ammonia = "4"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
mime_guess = "2"
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "io-util", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
