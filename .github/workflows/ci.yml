name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, so a secret added by an earlier commit in the branch is caught too.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Show tested revision
        run: echo "Validating ${GITHUB_SHA} for ${GITHUB_EVENT_NAME}"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan history for secrets
        run: ./gitleaks git --log-opts="--all" --redact --verbose --no-banner

      # .env files carry credentials and must stay untracked; .env.example is documentation only.
      - name: Reject committed environment files
        run: |
          set -euo pipefail
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "Committed environment files are not allowed:" >&2
            echo "$found" >&2
            echo "Add them to .gitignore and keep only .env.example." >&2
            exit 1
          fi
          echo "No committed environment files."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: backend

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run repository checks
        run: bash script/check.sh
