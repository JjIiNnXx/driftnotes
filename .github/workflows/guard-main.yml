name: Guard main

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-pr:
    name: require-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject forced pushes
        if: github.event.forced
        run: |
          echo "Force push to main detected. Use a feature branch and a pull request." >&2
          exit 1

      - name: Require an associated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "Direct push to main detected. Use a feature_<name> branch and a pull request." >&2
            exit 1
          fi
          echo "Commit is associated with a pull request."
