schema_version = 1
title = "栖迟个人博客文档集"
description = "个人博客从方案、架构、开发规范到运维部署的完整文档。"
language = "zh-CN"
updated_at = "2026-10-28"
default_document = "01-solution/01-方案总览.md"
source = "飞书《个人博客技术方案》v1.1；2026-10-28 迁移为本地 Markdown 后删除飞书原文档"

[conventions]
document_root = "."
path_style = "relative-to-docs"
daily_log_retention_days = 3
log_cleanup_interval_hours = 72

[[groups]]
id = "solution"
title = "方案设计"
path = "01-solution"
summary = "回答为什么做、做到什么边界、成本多少、如何分阶段推进。"

[[groups.documents]]
id = "overview"
title = "方案总览"
path = "01-solution/01-方案总览.md"
summary = "方案摘要、核心决策、建设目标、非目标与默认假设。"
tags = ["目标", "边界", "核心决策"]

[[groups.documents]]
id = "cost"
title = "免费额度与成本控制"
path = "01-solution/02-成本与免费额度.md"
summary = "Cloudflare 免费额度、CPU/请求约束、R2 与 Zero Trust 的账单边界。"
tags = ["成本", "免费额度", "Cloudflare"]

[[groups.documents]]
id = "roadmap"
title = "分阶段实施路线"
path = "01-solution/03-实施路线.md"
summary = "从阶段零技术验证到最小可用、完整体验和增强功能的推进顺序。"
tags = ["路线图", "阶段零", "Go/No-Go"]

[[groups.documents]]
id = "risk"
title = "风险、迁移预留与结论"
path = "01-solution/04-风险与结论.md"
summary = "主要风险与应对、PostgreSQL 迁移预留，以及评审后的最终结论。"
tags = ["风险", "结论", "迁移"]

[[groups]]
id = "architecture"
title = "架构设计"
path = "02-architecture"
summary = "总体架构、技术选型、目录、数据库、API、核心流程、缓存、页面与 SEO。"

[[groups.documents]]
id = "architecture-overview"
title = "总体架构"
path = "02-architecture/01-总体架构.md"
summary = "生产目标的双 Worker 架构、Service Binding 与本地实现映射。"
tags = ["总体架构", "Workers", "本地映射"]

[[groups.documents]]
id = "technology"
title = "技术选型"
